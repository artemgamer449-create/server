<!doctype html>
<html lang="ru" class="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>VisionGram Preference</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					colors: {
						surface: '#0a0a0c',
						panel: '#121214',
						panel2: '#17171a',
						edge: '#232327',
						edge2: '#2e2e33',
						ink: '#fafafa',
						mut: '#9b9ba3',
						dim: '#6b6b74',
					},
					fontFamily: {
						sans: ['var(--vg-font, "Inter")', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'],
					},
				},
			},
		};
	</script>
	<style>
		:root { color-scheme: dark; }
		html, body { background: #060608; }
		body {
			font-family: var(--vg-font, "Inter"), ui-sans-serif, system-ui, Segoe UI, sans-serif;
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
			font-feature-settings: "rlig" 1, "calt" 1;
		}
		::-webkit-scrollbar { width: 10px; height: 10px; }
		::-webkit-scrollbar-track { background: transparent; }
		::-webkit-scrollbar-thumb { background: #232327; border-radius: 999px; border: 2px solid #060608; }
		::-webkit-scrollbar-thumb:hover { background: #2e2e33; }

		.card { background: #0f0f11; border: 1px solid #1e1e22; }
		.card-2 { background: #121214; border: 1px solid #1e1e22; }

		.field {
			width: 100%;
			height: 40px;
			border-radius: 10px;
			border: 1px solid #232327;
			background: #0b0b0d;
			padding: 0 12px;
			font-size: 14px;
			color: #fafafa;
			outline: none;
			transition: border-color .15s ease, box-shadow .15s ease;
		}
		.field:focus { border-color: #3f3f46; box-shadow: 0 0 0 3px rgba(255,255,255,0.04); }
		.field::placeholder { color: #55555c; }
		textarea.field { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
		select.field { appearance: none; padding-right: 30px; }

		.btn {
			display: inline-flex; align-items: center; justify-content: center; gap: 8px;
			white-space: nowrap; border-radius: 10px; font-size: 13.5px; font-weight: 500;
			height: 38px; padding: 0 16px; transition: all .15s ease;
			border: 1px solid transparent; cursor: pointer;
		}
		.btn:disabled { opacity: .45; pointer-events: none; }
		.btn-primary { background: #fafafa; color: #0a0a0c; }
		.btn-primary:hover { background: #e4e4e7; }
		.btn-ghost { background: transparent; color: #d4d4d8; border-color: #232327; }
		.btn-ghost:hover { background: #17171a; border-color: #2e2e33; }
		.btn-danger { background: transparent; color: #f87171; border-color: rgba(248,113,113,.25); }
		.btn-danger:hover { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.4); }
		.btn-icon { width: 38px; padding: 0; }

		.toggle { position: relative; width: 40px; height: 22px; flex: none; cursor: pointer; }
		.toggle input { opacity: 0; width: 0; height: 0; }
		.toggle .track {
			position: absolute; inset: 0; border-radius: 999px; background: #232327;
			transition: background .18s ease;
		}
		.toggle .track::after {
			content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
			border-radius: 999px; background: #6b6b74; transition: all .18s ease;
		}
		.toggle input:checked + .track { background: #353539; }
		.toggle input:checked + .track::after { transform: translateX(18px); background: #fafafa; }

		.badge-chip {
			display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
			padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
			letter-spacing: .06em; line-height: 1; text-transform: uppercase; white-space: nowrap;
			border: 1px solid transparent;
		}
		.badge-chip .bi { display: inline-flex; width: 13px; height: 13px; flex: none; }
		.badge-chip .bi svg { width: 100%; height: 100%; }

		.shape-box {
			position: relative; display: flex; align-items: center; justify-content: center;
			width: 72px; height: 72px; border: 2px solid #2e2e33; border-radius: 12px;
			margin: 0 auto; transition: all .15s ease;
		}
		.shape-box .shape-inner {
			width: 44px; height: 44px; background: linear-gradient(135deg, #2e2e33, #1a1a1e);
			border: 1px solid #44444b; display: flex; align-items: center; justify-content: center;
		}
		.shape-box.active { border-color: #fafafa; }

		.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: #9b9ba3; border: 1px solid transparent; transition: all .15s ease; cursor: pointer; }
		.nav-item:hover { color: #e4e4e7; background: #121214; }
		.nav-item.active { color: #fafafa; background: #1a1a1e; border-color: #232327; }
		.nav-item svg { width: 17px; height: 17px; flex: none; }

		.spin { animation: spin 1s linear infinite; }
		@keyframes spin { to { transform: rotate(360deg); } }
		.fade-in { animation: fade .2s ease-out; }
		@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

		input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: #232327; outline: none; }
		input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 999px; background: #fafafa; border: none; cursor: pointer; }
	</style>
	<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=__turnstileReady" async defer></script>
</head>
<body class="min-h-screen text-ink antialiased" style="background:#060608;">
	<div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(circle_at_20%_-10%,rgba(255,255,255,0.04),transparent_40%)]"></div>

	<div id="app"></div>

	<div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-[80] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-2"></div>

	<script>
		const TURNSTILE_SITE_KEY = "0x4AAAAAAFi7N7hnSxXvj04S";
		const TOKEN_KEY = "visiongram.token";

		const ICONS = {
			dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
			badges: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M7 12v4a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-4"/><path d="M9 22h6"/></svg>',
			telegram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>',
			avatar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-3.3 3.6-6 8-6s8 2.7 8 6"/></svg>',
			fonts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 10 4"/><path d="M14 20 20 4"/><path d="M7 13h6"/><path d="M15 13h6"/></svg>',
			sessions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="16" r="1.6"/></svg>',
			logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>',
			menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>',
		};

		const ROLE_ICONS = {
			owner: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l4 4 5-7 5 7 4-4v11H3V7z"/><path d="M3 21h18"/></svg>',
			coder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9-4 3 4 3"/><path d="m16 9 4 3-4 3"/><path d="m14 5-4 14"/></svg>',
			admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
			tester: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5l-5 10a3 3 0 0 0 2.7 4.3h8.6A3 3 0 0 0 19 18L14 8V3"/><path d="M8 14h8"/></svg>',
			check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>',
		};

		const MUTED = {
			'neon-blue': { fg: '#7dd3fc', bg: 'rgba(56,189,248,.10)', border: 'rgba(56,189,248,.28)' },
			violet: { fg: '#c4b5fd', bg: 'rgba(139,92,246,.10)', border: 'rgba(139,92,246,.28)' },
			gold: { fg: '#fcd34d', bg: 'rgba(245,158,11,.10)', border: 'rgba(245,158,11,.28)' },
			fire: { fg: '#fca5a5', bg: 'rgba(239,68,68,.10)', border: 'rgba(239,68,68,.28)' },
			emerald: { fg: '#6ee7b7', bg: 'rgba(16,185,129,.10)', border: 'rgba(16,185,129,.28)' },
			pink: { fg: '#f9a8d4', bg: 'rgba(236,72,153,.10)', border: 'rgba(236,72,153,.28)' },
			platinum: { fg: '#e5e7eb', bg: 'rgba(148,163,184,.10)', border: 'rgba(148,163,184,.28)' },
			teal: { fg: '#5eead4', bg: 'rgba(20,184,166,.12)', border: 'rgba(20,184,166,.28)' },
		};
		const DEFAULT_PALETTE = 'violet';

		const ROLE_LABELS = { owner: 'Owner', coder: 'Developer', admin: 'Admin', tester: 'Tester' };

		const SHAPES = {
			circle: { label: 'Circle', css: 'clip-path:circle(50% at 50% 50%);border-radius:0;' },
			rounded: { label: 'Rounded', css: 'border-radius:32%;' },
			squircle: { label: 'Squircle', css: 'border-radius:24%;' },
			square: { label: 'Square', css: 'border-radius:0;' },
			diamond: { label: 'Diamond', css: 'clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);border-radius:0;' },
			hexagon: { label: 'Hexagon', css: 'clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);border-radius:0;' },
			octagon: { label: 'Octagon', css: 'clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);border-radius:0;' },
			star: { label: 'Star', css: 'clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border-radius:0;' },
			leaf: { label: 'Leaf', css: 'border-radius:50% 50% 50% 0;' },
			none: { label: 'None', css: 'border-radius:0;' },
		};

		let token = null;
		let user = null;
		let currentTab = 'dashboard';
		let turnstileToken = '';
		let activeFontFace = null;

		const $ = (id) => document.getElementById(id);
		const appEl = $('app');

		function storeToken(value) {
			token = value;
			try { value ? localStorage.setItem(TOKEN_KEY, value) : localStorage.removeItem(TOKEN_KEY); } catch (e) {}
		}
		try { token = localStorage.getItem(TOKEN_KEY) || null; } catch (e) {}

		function toast(message, type = 'success') {
			const container = $('toasts');
			const item = document.createElement('div');
			item.className = 'fade-in pointer-events-auto flex items-start gap-3 rounded-xl border bg-[#121214] p-4 text-sm shadow-xl ' + (type === 'error' ? 'border-[#3f2024]' : 'border-[#2b2b30]');
			const dot = document.createElement('span');
			dot.className = 'mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-[11px] font-bold ' + (type === 'error' ? 'bg-[#f87171]/15 text-[#f87171]' : 'bg-[#fafafa]/10 text-[#e4e4e7]');
			dot.textContent = type === 'error' ? '!' : '✓';
			const text = document.createElement('span');
			text.className = 'leading-5 text-[#d4d4d8]';
			text.textContent = message;
			item.append(dot, text);
			container.append(item);
			setTimeout(() => item.remove(), 4200);
		}

		async function api(path, options = {}) {
			const headers = { Accept: 'application/json', ...(options.headers || {}) };
			if (token) headers['Authorization'] = 'Bearer ' + token;
			if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
			const response = await fetch(path, { ...options, headers });
			const text = await response.text();
			let data = {};
			if (text) { try { data = JSON.parse(text); } catch { data = { detail: text }; } }
			if (!response.ok) {
				const detail = Array.isArray(data.detail) ? data.detail.map((d) => d.msg || JSON.stringify(d)).join('; ') : data.detail;
				if (response.status === 401 && token) { logoutLocal(); }
				throw new Error(detail || ('HTTP ' + response.status));
			}
			return data;
		}

		async function apiRaw(path) {
			const headers = { Accept: '*/*' };
			if (token) headers['Authorization'] = 'Bearer ' + token;
			const response = await fetch(path, { headers });
			if (!response.ok) throw new Error('HTTP ' + response.status);
			return await response.arrayBuffer();
		}

		function el(tag, className, text) {
			const node = document.createElement(tag);
			if (className) node.className = className;
			if (text !== undefined) node.textContent = text;
			return node;
		}

		function svgIcon(name) {
			const span = el('span');
			span.innerHTML = ICONS[name] || '';
			return span;
		}

		// ---------- Login ----------

		function renderLogin(errorMessage) {
			document.documentElement.classList.add('dark');
			appEl.innerHTML = `
				<div class="flex min-h-screen items-center justify-center px-4 py-10">
					<div class="fade-in w-full max-w-sm">
						<div class="mb-8 text-center">
							<div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl border border-[#232327] bg-[#121214]">
								<span class="text-sm font-bold tracking-[0.2em] text-[#fafafa]">VG</span>
							</div>
							<h1 class="text-xl font-semibold tracking-tight text-[#fafafa]">VisionGram Preference</h1>
							<p class="mt-1.5 text-sm text-[#6b6b74]">Вход в панель управления</p>
						</div>
						<div class="card-2 rounded-2xl p-6">
							<form id="loginForm" class="grid gap-4">
								<div>
									<label class="mb-1.5 block text-[13px] font-medium text-[#d4d4d8]">Логин</label>
									<input id="loginUsername" class="field" autocomplete="username" placeholder="owner" required>
								</div>
								<div>
									<label class="mb-1.5 block text-[13px] font-medium text-[#d4d4d8]">Пароль</label>
									<input id="loginPassword" type="password" class="field" autocomplete="current-password" placeholder="••••••••" required>
								</div>
								<div id="turnstileSlot" class="flex justify-center"></div>
								<div id="loginError" class="hidden rounded-lg border border-[#3f2024] bg-[#1a0f11] px-3 py-2 text-[13px] text-[#f87171]"></div>
								<button id="loginBtn" type="submit" class="btn btn-primary mt-1 w-full">Войти</button>
							</form>
						</div>
					</div>
				</div>`;

			if (errorMessage) showLoginError(errorMessage);
			$('loginForm').addEventListener('submit', handleLogin);
			renderTurnstile();
		}

		function showLoginError(msg) {
			const box = $('loginError');
			if (box) { box.textContent = msg; box.classList.remove('hidden'); }
		}

		async function handleLogin(e) {
			e.preventDefault();
			if (!turnstileToken) { showLoginError('Пройдите проверку капчи'); return; }
			const username = $('loginUsername').value.trim();
			const password = $('loginPassword').value;
			const btn = $('loginBtn');
			btn.disabled = true; btn.textContent = 'Проверка…';
			try {
				const data = await api('/api/auth/login', {
					method: 'POST',
					body: JSON.stringify({ username, password, turnstile_token: turnstileToken }),
				});
				storeToken(data.access_token);
				user = data.user;
				turnstileToken = '';
				await bootApp();
			} catch (err) {
				showLoginError(err.message);
				resetTurnstile();
				btn.disabled = false; btn.textContent = 'Войти';
			}
		}

		function logoutLocal() {
			storeToken(null);
			user = null;
			currentTab = 'dashboard';
			renderLogin();
		}

		async function logout() {
			try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) {}
			logoutLocal();
		}

		// ---------- Turnstile ----------

		function renderTurnstile() {
			const slot = $('turnstileSlot');
			if (!slot) return;
			if (typeof window.turnstile === 'undefined') return;
			window.turnstile.render(slot, {
				sitekey: TURNSTILE_SITE_KEY,
				theme: 'dark',
				callback: (value) => { turnstileToken = value; },
				'expired-callback': () => { turnstileToken = ''; },
				'error-callback': () => { turnstileToken = ''; },
			});
		}

		function resetTurnstile() {
			try { if (window.turnstile) window.turnstile.reset(); } catch (e) {}
		}

		window.__turnstileReady = function () {
			if (!token) renderTurnstile();
		};

		// ---------- App shell ----------

		async function bootApp() {
			try { user = await api('/api/auth/me'); } catch (e) { logoutLocal(); return; }
			renderShell();
			switchTab(currentTab);
			setInterval(refreshSystem, 5000);
			applyActiveFont();
		}

		const NAV = [
			{ id: 'dashboard', label: 'Дашборд', icon: 'dashboard' },
			{ id: 'badges', label: 'Бейджи', icon: 'badges' },
			{ id: 'telegram', label: 'Кастом Telegram', icon: 'telegram' },
			{ id: 'avatars', label: 'Формы аватарок', icon: 'avatar' },
			{ id: 'fonts', label: 'Шрифты', icon: 'fonts' },
			{ id: 'sessions', label: 'Сессии', icon: 'sessions' },
		];

		function renderShell() {
			appEl.innerHTML = `
				<div class="mx-auto flex min-h-screen w-full max-w-[1280px] flex-col lg:flex-row">
					<aside class="hidden w-[240px] shrink-0 border-r border-[#1e1e22] lg:flex lg:flex-col">
						<div class="flex h-16 items-center gap-3 border-b border-[#1e1e22] px-5">
							<div class="flex h-9 w-9 items-center justify-center rounded-lg border border-[#232327] bg-[#121214]">
								<span class="text-xs font-bold tracking-[0.18em] text-[#fafafa]">VG</span>
							</div>
							<div class="leading-tight">
								<div class="text-sm font-semibold text-[#fafafa]">VisionGram</div>
								<div class="text-[11px] text-[#6b6b74]">Preference</div>
							</div>
						</div>
						<nav class="flex-1 space-y-1 p-3">
							${NAV.map((n) => `<button class="nav-item" data-tab="${n.id}">${ICONS[n.icon]}<span>${n.label}</span></button>`).join('')}
						</nav>
						<div class="border-t border-[#1e1e22] p-3">
							<div class="mb-3 flex items-center gap-3 px-3">
								<div class="flex h-8 w-8 items-center justify-center rounded-full bg-[#232327] text-[12px] font-semibold text-[#fafafa]">${(user.username || 'o').slice(0, 1).toUpperCase()}</div>
								<div class="leading-tight">
									<div class="text-[13px] font-medium text-[#e4e4e7]">${escapeHtml(user.username)}</div>
									<div class="text-[11px] text-[#6b6b74]">Владелец</div>
								</div>
							</div>
							<button id="logoutBtn" class="nav-item" style="color:#f87171;">${ICONS.logout}<span>Выйти</span></button>
						</div>
					</aside>

					<div class="flex min-w-0 flex-1 flex-col">
						<header class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-[#1e1e22] bg-[#060608]/80 px-5 backdrop-blur">
							<button id="mobileMenu" class="btn btn-ghost btn-icon lg:hidden">${ICONS.menu}</button>
							<div class="min-w-0">
								<h1 id="pageTitle" class="text-[15px] font-semibold text-[#fafafa]">Дашборд</h1>
							</div>
							<div class="ml-auto flex items-center gap-3">
								<span id="healthPill" class="inline-flex items-center gap-2 rounded-full border border-[#232327] bg-[#0f0f11] px-3 py-1.5 text-[12px] text-[#9b9ba3]">
									<span class="h-1.5 w-1.5 rounded-full bg-[#6b6b74]"></span>
									<span id="healthPillText">Проверка…</span>
								</span>
							</div>
						</header>

		function fmtBytes(bytes) {

			let i = 0; let v = bytes;
			while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }

		function metricCard(id, label, hint) {
			return `
				<div class="card rounded-2xl p-5">

						<span class="text-[13px] font-medium text-[#9b9ba3]">${label}</span>

					</div>
					<div id="metric-${id}" class="mt-3 text-2xl font-semibold tracking-tight text-[#fafafa]">—</div>
					<div class="mt-1 text-[12px] text-[#6b6b74]">${hint}</div>
				</div>`;
		}

		function paintSystem(data) {
			setMetric('ram', data.ram.percent.toFixed(0) + '%', `${fmtBytes(data.ram.used)} / ${fmtBytes(data.ram.total)}`);
			setMetric('disk', fmtBytes(data.disk.free), `${data.disk.percent}% занято`);
			setMetric('ping', data.ping.db_ms + ' мс', 'SQLite запрос');
			setMetric('uptime', fmtUptime(data.uptime), 'с момента запуска');

			const bars = $('systemBars');
			if (bars) {
				bars.innerHTML = `
					${progressBar('Использование RAM', data.ram.percent)}
					${progressBar('Использование диска', data.disk.percent)}`;
			}
		}

		function setMetric(id, value, sub) {
			const node = $('metric-' + id);
			if (!node) return;
			node.textContent = value;
			node.parentElement.querySelector('div.text-\\[12px\\]').textContent = sub;
		}

		function progressBar(label, percent) {
			return `
				<div>
					<div class="mb-1.5 flex items-center justify-between text-[12px]">
						<span class="text-[#9b9ba3]">${label}</span>
						<span class="font-medium text-[#e4e4e7]">${percent.toFixed(1)}%</span>
					</div>
					<div class="h-2 overflow-hidden rounded-full bg-[#1a1a1e]">
						<div class="h-full rounded-full bg-[#55555c] transition-all duration-500" style="width:${Math.min(100, percent)}%"></div>
					</div>
				</div>`;
		}

		function fmtUptime(seconds) {
			const d = Math.floor(seconds / 86400);
			const h = Math.floor((seconds % 86400) / 3600);
			const m = Math.floor((seconds % 3600) / 60);
			if (d) return `${d}д ${h}ч`;
			if (h) return `${h}ч ${m}м`;
			return `${m}м`;
		}

		async function loadFonts() {
			const wrap = $('fontListWrap'); const count = $('fontCount');

				const data = await api('/api/fonts');

					const row = el('div', 'flex items-center justify-between gap-3 rounded-xl border border-[#1e1e22] bg-[#0b0b0d] px-4 py-3');

					previewBtn.addEventListener('click', () => previewFont(font));
					const activateBtn = el('button', 'btn ' + (active ? 'btn-primary' : 'btn-ghost'), active ? 'Активен' : 'Активировать');
					if (!active) activateBtn.addEventListener('click', async () => {
						try { await api('/api/fonts/' + font.id + '/activate', { method: 'POST' }); activeFontId = font.id; await loadFonts(); applyActiveFont(); toast('Шрифт активирован'); }
						catch (e) { toast(e.message, 'error'); }
					});
					const delBtn = el('button', 'btn btn-ghost btn-icon', ''); delBtn.style.color = '#f87171';

		async function uploadFont(e) {
			e.preventDefault();
			const input = $('fontFile');
			const file = input.files[0];
			if (!file) { toast('Выберите файл', 'error'); return; }
			const btn = $('fontUpload'); btn.disabled = true; btn.textContent = 'Загрузка…';
			try {
				const formData = new FormData();
				formData.append('file', file);
				const headers = { Accept: 'application/json' };
				if (token) headers['Authorization'] = 'Bearer ' + token;
				const response = await fetch('/api/fonts', { method: 'POST', headers, body: formData });
				const text = await response.text();
				let data = {}; try { data = JSON.parse(text); } catch { data = { detail: text }; }
				if (!response.ok) { const detail = Array.isArray(data.detail) ? data.detail.map((d) => d.msg || JSON.stringify(d)).join('; ') : data.detail; throw new Error(detail || 'HTTP ' + response.status); }
				toast('Шрифт загружен');
				input.value = ''; $('fontFileLabel').textContent = 'Выберите файл .ttf или .otf';
				await loadFonts();
			} catch (err) { toast(err.message, 'error'); }
			finally { btn.disabled = false; btn.textContent = 'Загрузить'; }
		}

		async function previewFont(font) {
			try {
				const buffer = await apiRaw('/api/fonts/' + font.id + '/file');
				const blob = new Blob([buffer], { type: font.mime });
				const url = URL.createObjectURL(blob);
				const face = new FontFace(font.name, 'url(' + url + ')');
				await face.load();
				document.fonts.add(face);
				setDashboardFont(`'${font.name}'`);
				activeFontFace = face;
				$('fontDetach').disabled = false;
				toast('Предпросмотр шрифта применён');
			} catch (e) { toast('Не удалось загрузить шрифт', 'error'); }
		}

		function setDashboardFont(value) {
			document.documentElement.style.setProperty('--vg-font', value || '"Inter"');
			document.body.style.fontFamily = value || '"Inter", ui-sans-serif, system-ui, sans-serif';
		}

		async function applyActiveFont() {
			if (activeFontId == null) return;
			try {
				const data = await api('/api/fonts');
				activeFontId = data.active_font_id;
				const font = (data.fonts || []).find((f) => f.id === activeFontId);
				if (!font) return;
				const buffer = await apiRaw('/api/fonts/' + font.id + '/file');
				const blob = new Blob([buffer], { type: font.mime });
				const url = URL.createObjectURL(blob);
				const face = new FontFace(font.name, 'url(' + url + ')');
				await face.load();
				document.fonts.add(face);
				setDashboardFont(`'${font.name}'`);
			} catch (e) {}
		}

						row.append(btn);
					}
					wrap.append(row);
				}
			} catch (e) { wrap.innerHTML = '<div class="py-8 text-center text-[13px] text-[#f87171]">' + escapeHtml(e.message) + '</div>'; }
		}

		async function terminateSession(id) {
			if (!confirm('Завершить эту сессию?')) return;
			try { await api('/api/sessions/' + id, { method: 'DELETE' }); toast('Сессия завершена'); await loadSessions(); }
			catch (e) { toast(e.message, 'error'); }
		}

		function formatDate(iso) {
			if (!iso) return '—';
			try { return new Date(iso.replace(' ', 'T') + 'Z').toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }); }
			catch (e) { return iso; }
		}

		// ---------- Boot ----------

		if (token) {
			bootApp();
		} else {
			renderLogin();
		}
	</script>
</body>
</html>
